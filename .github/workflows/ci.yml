name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      # Owner's code only: VideoMAE/ is upstream and excluded in pyproject.toml.
      - run: uv run ruff check .
      - run: uv run ruff format --check SaVi scripts tests site/tools
      - run: uv run pytest
